<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="14" fill="#2563EB"/>

  <!-- White "A" — two angled legs + crossbar -->
  <path d="M14 54 L28 12 L36 12 L50 54 L43 54 L32 22 L21 54 Z" fill="#FFFFFF"/>
  <rect x="23" y="38" width="18" height="5" rx="1" fill="#FFFFFF"/>

  <!-- Green candlesticks (rising) -->
  <rect x="30" y="30" width="4" height="12" rx="0.5" fill="#16A34A"/>
  <rect x="31.5" y="26" width="1" height="20" fill="#16A34A"/>

  <rect x="37" y="26" width="4" height="12" rx="0.5" fill="#16A34A"/>
  <rect x="38.5" y="22" width="1" height="20" fill="#16A34A"/>

  <!-- Red candlestick (older / lower) -->
  <rect x="24" y="36" width="4" height="9" rx="0.5" fill="#DC2626"/>
  <rect x="25.5" y="33" width="1" height="15" fill="#DC2626"/>

  <!-- White diagonal arrow rising through the A -->
  <path d="M18 46 L46 24" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <path d="M39 24 L46 24 L46 31" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
